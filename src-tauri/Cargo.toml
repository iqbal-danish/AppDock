[package]
name = "appdock"
version = "0.1.0"
description = "AppDock - Unified Windows Launcher for Portable Tauri Apps"
authors = ["diqbal"]
edition = "2024"

[lib]
name = "appdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
